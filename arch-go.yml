version: 1
threshold:
  compliance: 100
  coverage: 0
dependenciesRules:
  - package: 'internal.infra'
    shouldNotDependsOn:
      internal:
        - internal.service'
  - package: 'internal.service'
    shouldNotDependsOn:
      internal:
        - 'internal.infra'
  - package: 'internal.data'
    shouldNotDependsOn:
      internal:
        - 'internal.infra'
        - 'internal.service'
      external:
        - "github.com/wailsapp/wails/v2/pkg/runtime"
contentsRules:
  - package: 'internal.repository'
    shouldOnlyContainInterfaces: true
